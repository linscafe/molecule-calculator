<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Molecule Calculator">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d8fd8" />
      <stop offset="0.5" stop-color="#1b5e9c" />
      <stop offset="1" stop-color="#0e3559" />
    </linearGradient>
    <radialGradient id="sheen" cx="0.18" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="atom" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#bcdcfa" />
    </linearGradient>
    <linearGradient id="core" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#9fe4ff" />
      <stop offset="1" stop-color="#39a8e8" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#tile)" />
  <rect width="64" height="64" rx="15" fill="url(#sheen)" />

  <!-- Same geometry as the header banner's emblem, so the tab icon and the
       page read as one mark. Deliberately only four atoms: at 16px anything
       smaller than these radii collapses into a smudge. -->
  <ellipse cx="32" cy="34" rx="26" ry="12" fill="none" stroke="#bcdcfa"
    stroke-opacity="0.3" stroke-width="1.5" transform="rotate(-14 32 34)" />

  <g stroke="#cfe6fb" stroke-width="3.4" stroke-linecap="round" stroke-opacity="0.9">
    <path d="M32 34 L18 19" />
    <path d="M32 34 L48 21" />
    <path d="M32 34 L35 52" />
  </g>

  <circle cx="18" cy="19" r="7" fill="url(#atom)" />
  <circle cx="48" cy="21" r="6" fill="url(#atom)" />
  <circle cx="35" cy="52" r="6" fill="url(#atom)" />
  <circle cx="32" cy="34" r="10.5" fill="url(#core)" />
  <circle cx="28.8" cy="30.8" r="3.2" fill="#ffffff" fill-opacity="0.72" />
</svg>
