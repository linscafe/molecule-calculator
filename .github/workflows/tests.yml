name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # No install step: the project has no dependencies by design (ADR-0002).
      # Bare `node --test` auto-discovers tests/; `node --test tests/` would
      # resolve the directory as a module path and fail.
      - run: node --test
